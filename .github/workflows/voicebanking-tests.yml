name: VoiceBanking Playwright Tests

# Manual trigger only, mirroring the Jenkins pipeline's ENV/SUITE parameters (Jenkinsfile) —
# not push/pull_request. UI10_TransferMoneyTest and friends complete real ₹1 transfers and
# spend a limited live OTP-attempt budget against a real stage backend on every run (see the
# class-level doc comment on UI10_TransferMoneyTest.java), so this must stay opt-in rather than
# firing automatically on every commit. Add push/pull_request triggers only if that's actually
# wanted, and probably scoped to a "smoke"-only, non-transfer subset if so.
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options: [stage, prod, dev]
        default: dev
      suite:
        description: 'Test suite to run (TestNG group)'
        required: true
        type: choice
        options: [smoke, regression, api, ui]
        default: smoke

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Voice-query audio is generated by edge-tts (Microsoft's free neural TTS) + ffmpeg, same
      # as the Jenkins pipeline's "Verify TTS Tooling" stage — both must be on PATH for the test
      # JVM to shell out to (see TtsUtil.java / EdgeTtsEngine.java).
      - name: Install TTS tooling (edge-tts + ffmpeg)
        run: |
          pip install --quiet edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m edge_tts --version
          ffmpeg -version

      - name: Install Playwright browsers
        run: mvn -B exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B clean test -DtestGroups=${{ inputs.suite }} -Denv=${{ inputs.env }}

      # maven-surefire-plugin's <testFailureIgnore>true</testFailureIgnore> (pom.xml) means
      # `mvn test` always exits 0 even with failed assertions — Jenkins reflects the real result
      # via its own `junit` step marking the build unstable; this is the GitHub Actions
      # equivalent, reading the same target/surefire-reports/*.xml and failing the job/run
      # summary when a test actually failed.
      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'target/surefire-reports/TEST-*.xml'
          require_tests: false

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ inputs.env }}-${{ inputs.suite }}
          path: target/extent-report
          if-no-files-found: ignore

      - name: Upload dashboard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-report-${{ inputs.env }}-${{ inputs.suite }}
          path: target/dashboard-report
          if-no-files-found: ignore

      - name: Upload surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ inputs.env }}-${{ inputs.suite }}
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.env }}-${{ inputs.suite }}
          path: target/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.env }}-${{ inputs.suite }}
          path: target/videos
          if-no-files-found: ignore
